version: "3.9"

services:
  # ── Ollama (local LLM server) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: novastra-itsm-ollama
    ports:
      - "11434:11434"
    gpus: all
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # Requires NVIDIA Container Toolkit on Docker hosts.

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novastra-itsm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore
      - ./feedback_db.json:/app/feedback_db.json
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

  # ── Frontend (served via nginx after build) ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: novastra-itsm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_models:
