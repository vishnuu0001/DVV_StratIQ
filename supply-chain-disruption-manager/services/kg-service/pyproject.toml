[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kg-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "neo4j>=5.18",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "testcontainers[neo4j]>=4.5",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kg"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
