<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strat-Aqorynth Portal</title>
  <meta http-equiv="refresh" content="0; url=/login">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #e5eef7;
      font-family: Inter, Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        radial-gradient(circle at 42% 0%, rgba(79,70,229,0.24), transparent 38rem),
        radial-gradient(circle at 82% 20%, rgba(6,182,212,0.18), transparent 32rem),
        #030712;
      background-size: 64px 64px, 64px 64px, auto, auto, auto;
    }
    main {
      width: min(560px, calc(100vw - 32px));
      border: 1px solid rgba(148,163,184,0.28);
      border-radius: 24px;
      background: rgba(2,6,23,0.76);
      padding: 32px;
      text-align: center;
      box-shadow: 0 28px 80px rgba(0,0,0,0.36);
    }
    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #06b6d4;
      color: #020617;
      font-weight: 900;
      font-size: 24px;
    }
    p:first-of-type {
      margin: 0 0 8px;
      color: #67e8f9;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #a9b8c8; line-height: 1.6; }
    a {
      display: inline-flex;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-weight: 900;
      background: linear-gradient(90deg, #4f46e5, #2563eb, #06b6d4);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">▦</div>
    <p>Portal Access</p>
    <h1>Opening Strat-Aqorynth login</h1>
    <p>Use admin / Admin@1234 to enter the unified modernization workspace.</p>
    <a href="/login">Continue to Login</a>
  </main>
</body>
</html>
