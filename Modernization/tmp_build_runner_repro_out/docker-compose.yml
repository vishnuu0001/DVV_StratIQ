version: '3.9'
services:
  backend:
    build: ./backend
    ports:
    - 8080:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
    - db
  frontend:
    build: ./frontend
    ports:
    - 4200:80
    depends_on:
    - backend
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong!Passw0rd
    ports:
    - 1433:1433
